name: validate
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rezahh107/EV4-Architect-Repo
          ref: 338228cec0aeae951581690c3faba68f512e615c
          path: EV4-Architect-Repo
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: $env:PYTHONPATH='src'; uv run pytest -q
      - run: $env:PYTHONPATH='src'; uv run python -m compileall -q src
