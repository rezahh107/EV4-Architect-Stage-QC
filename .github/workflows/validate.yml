name: validate
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: rezahh107/EV4-Architect-Repo
          ref: 338228cec0aeae951581690c3faba68f512e615c
          path: EV4-Architect-Repo
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Verify locked authority checkout
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:EV4_ARCHITECT_REPO = Join-Path $env:GITHUB_WORKSPACE "EV4-Architect-Repo"
          git -C $env:EV4_ARCHITECT_REPO rev-parse HEAD
          git -C $env:EV4_ARCHITECT_REPO status --porcelain
          @'
          import os
          from pathlib import Path

          from ev4_architect_stage_qc.architect_adapter import verify

          authority_root = Path(os.environ["EV4_ARCHITECT_REPO"])
          connection = verify(authority_root)
          print("authority_path:", authority_root)
          print("path_exists:", authority_root.exists())
          print("git_dir_exists:", (authority_root / ".git").exists())
          print("connection_ok:", connection.ok)
          print("connection_reason:", connection.reason)
          raise SystemExit(0 if connection.ok else 1)
          '@ | uv run python -
      - name: Assert tested PR head
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          Write-Host "tested_sha=$actual"
          if ($actual -ne '${{ github.event.pull_request.head.sha }}') { throw "PR head mismatch" }
      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:EV4_ARCHITECT_REPO = Join-Path $env:GITHUB_WORKSPACE "EV4-Architect-Repo"
          uv run pytest -q
      - name: Compile Python
        shell: pwsh
        run: uv run python -m compileall -q src tests
      - name: Check patch whitespace
        shell: pwsh
        run: git diff --check
      - name: Verify authority compatibility across checkout changes
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:EV4_ARCHITECT_REPO = Join-Path $env:GITHUB_WORKSPACE "EV4-Architect-Repo"
          git -C $env:EV4_ARCHITECT_REPO config user.email "qc-ci@example.invalid"
          git -C $env:EV4_ARCHITECT_REPO config user.name "QC CI"
          New-Item -ItemType Directory -Force -Path (Join-Path $env:EV4_ARCHITECT_REPO "docs") | Out-Null
          Set-Content -NoNewline -Path (Join-Path $env:EV4_ARCHITECT_REPO "docs/qc-compatibility-test.txt") -Value "unrelated"
          git -C $env:EV4_ARCHITECT_REPO add docs/qc-compatibility-test.txt
          git -C $env:EV4_ARCHITECT_REPO commit -m "test: unrelated compatibility change"
          @'
          import os
          from pathlib import Path
          from ev4_architect_stage_qc.architect_adapter import verify

          connection = verify(Path(os.environ["EV4_ARCHITECT_REPO"]))
          assert connection.ok, connection.reason
          assert connection.commit != connection.reference_commit
          '@ | uv run python -
          Add-Content -Path (Join-Path $env:EV4_ARCHITECT_REPO "scripts/architect_quality_runtime.py") -Value "# intentional CI authority mismatch"
          @'
          import os
          from pathlib import Path
          from ev4_architect_stage_qc.architect_adapter import verify

          connection = verify(Path(os.environ["EV4_ARCHITECT_REPO"]))
          assert not connection.ok
          assert "Changed authority file: scripts/architect_quality_runtime.py" == connection.reason
          '@ | uv run python -
  linux-publisher-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: rezahh107/EV4-Architect-Repo
          ref: 338228cec0aeae951581690c3faba68f512e615c
          path: EV4-Architect-Repo
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Linux-native publisher core tests
        env:
          PYTHONPATH: src
          EV4_ARCHITECT_REPO: ${{ github.workspace }}/EV4-Architect-Repo
        run: uv run pytest -q
