name: diagnose-lock-temporary

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - name: Checkout exact Stage-QC head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read Architect dependency from Lock
        id: dependency
        shell: pwsh
        run: |
          $lock = Get-Content -Raw -LiteralPath "architect-authority.lock.json" | ConvertFrom-Json
          $sha = [string]$lock.reference_commit_sha
          if ($sha -cnotmatch '^[0-9a-f]{40}$') { throw "Malformed Lock reference commit" }
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ARCHITECT_HEAD_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout exact Architect dependency
        uses: actions/checkout@v4
        with:
          repository: rezahh107/EV4-Architect-Repo
          ref: ${{ steps.dependency.outputs.sha }}
          path: EV4-Architect-Repo
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize exact committed Architect bytes
        shell: pwsh
        run: |
          $architect = Join-Path $env:GITHUB_WORKSPACE "EV4-Architect-Repo"
          git -C $architect config core.autocrlf false
          git -C $architect config core.eol lf
          Get-ChildItem -LiteralPath $architect -Force |
            Where-Object { $_.Name -ne ".git" } |
            Remove-Item -Recurse -Force
          git -C $architect reset --hard $env:ARCHITECT_HEAD_SHA

      - uses: astral-sh/setup-uv@v5

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Generate and compare canonical Lock
        id: compare
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:EV4_ARCHITECT_REPO = Join-Path $env:GITHUB_WORKSPACE "EV4-Architect-Repo"
          $env:GENERATED_LOCK = Join-Path $env:RUNNER_TEMP "generated-architect-authority.lock.json"
          @'
          import hashlib
          import json
          import os
          from pathlib import Path

          from ev4_architect_stage_qc.lock_generator import generate_lock_bytes

          root = Path(os.environ["EV4_ARCHITECT_REPO"])
          actual_path = Path("architect-authority.lock.json")
          actual = actual_path.read_bytes()
          generated = generate_lock_bytes(root, expected_commit=os.environ["ARCHITECT_HEAD_SHA"])
          Path(os.environ["GENERATED_LOCK"]).write_bytes(generated)
          print("actual_sha256:", hashlib.sha256(actual).hexdigest())
          print("generated_sha256:", hashlib.sha256(generated).hexdigest())
          print("actual_length:", len(actual))
          print("generated_length:", len(generated))
          if actual != generated:
              left = json.loads(actual.decode("utf-8"))
              right = json.loads(generated.decode("utf-8"))
              for key in sorted(set(left) | set(right)):
                  if key == "files":
                      continue
                  if left.get(key) != right.get(key):
                      print(f"top_level_difference:{key}:actual={left.get(key)!r}:generated={right.get(key)!r}")
              left_files = left.get("files", {})
              right_files = right.get("files", {})
              for path in sorted(set(left_files) | set(right_files)):
                  if left_files.get(path) != right_files.get(path):
                      print(
                          f"file_difference:{path}:actual={left_files.get(path)!r}:generated={right_files.get(path)!r}"
                      )
              raise SystemExit(1)
          print("canonical_lock_match:true")
          '@ | uv run python -

      - name: Upload generated Lock diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-lock-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/generated-architect-authority.lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Enforce comparison result
        if: steps.compare.outcome != 'success'
        run: exit 1
