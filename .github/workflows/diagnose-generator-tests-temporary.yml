name: diagnose-generator-tests-temporary

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - name: Checkout exact Stage-QC head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read Architect dependency from Lock
        id: dependency
        shell: pwsh
        run: |
          $lock = Get-Content -Raw -LiteralPath "architect-authority.lock.json" | ConvertFrom-Json
          $sha = [string]$lock.reference_commit_sha
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout exact Architect dependency
        uses: actions/checkout@v4
        with:
          repository: rezahh107/EV4-Architect-Repo
          ref: ${{ steps.dependency.outputs.sha }}
          path: EV4-Architect-Repo
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize exact Architect bytes
        shell: pwsh
        run: |
          $architect = Join-Path $env:GITHUB_WORKSPACE "EV4-Architect-Repo"
          git -C $architect config core.autocrlf false
          git -C $architect config core.eol lf
          Get-ChildItem -LiteralPath $architect -Force |
            Where-Object { $_.Name -ne ".git" } |
            Remove-Item -Recurse -Force
          git -C $architect reset --hard ${{ steps.dependency.outputs.sha }}

      - uses: astral-sh/setup-uv@v5

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run generator tests with retained log
        id: tests
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:EV4_ARCHITECT_REPO = Join-Path $env:GITHUB_WORKSPACE "EV4-Architect-Repo"
          $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1"
          uv run pytest -p no:cacheprovider -vv tests/test_lock_generator.py `
            2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/stage-qc-lock-generator-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload generator test diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generator-tests-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/stage-qc-lock-generator-tests.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce test result
        if: steps.tests.outcome != 'success'
        run: exit 1
